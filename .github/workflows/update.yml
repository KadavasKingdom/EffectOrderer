name: Update Dependencies

on:
  workflow_dispatch:
    # allow manual trigger

jobs:
  update-dep:
    permissions:
      contents: write
      pull-requests: write
    uses: KadavasKingdom/workflows/.github/workflows/dependency_update.yml@main
    with:
      # version can be "latest" to download latest in-dev build.
      dependencies: >-
        [
          {
            "repo": "KadavasKingdom/LabApiExtensions",
            "version": "latest"
          }
        ]
    secrets:
      # Custom repos need custom secret! Edit this value to able to download internal repos.
      gh_token: ${{ secrets.GITHUB_TOKEN }}